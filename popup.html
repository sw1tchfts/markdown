<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Page to Markdown</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Page to Markdown</h1>
    </header>
    <main>
      <label class="row">
        <input type="checkbox" id="readable" checked />
        Extract main content only
      </label>
      <label class="row">
        <input type="checkbox" id="frontmatter" checked />
        Include YAML front matter
      </label>
      <label class="row stacked">
        <span>Images</span>
        <select id="imageMode">
          <option value="sidecar">Save alongside (folder)</option>
          <option value="link">Link to original</option>
        </select>
      </label>
      <button id="save" type="button">Save as .md</button>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
